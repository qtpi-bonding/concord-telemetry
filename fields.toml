# Shared field-name registry. Adding a name is a one-line PR.
# label = true: the field is a baggage label (carried across spans and processes, stamped
# as concord.label.<name>); it must not be recorded through Debug.
[fields]
action_id = { type = "str", meaning = "Action id", label = true }
session_id = { type = "str", meaning = "Id of the Session the work belongs to", label = true }
elapsed_ms = { type = "int", meaning = "Elapsed wall time in milliseconds" }
agent_id = { type = "str", meaning = "Agent principal id (opaque string)", label = true }
delivery_id = { type = "str", meaning = "Delivery id; stable across resends", label = true }
room_id = { type = "str", meaning = "Room id" }
message_id = { type = "str", meaning = "Room message id", label = true }
place_id = { type = "str", meaning = "Place id", label = true }
daemon_id = { type = "str", meaning = "Daemon id", label = true }
batch_sequence = { type = "int", meaning = "Mailbox batch sequence number" }
context = { type = "str", meaning = "Short fixed label for where a log comes from" }
node_id = { type = "str", meaning = "Id of a graph node" }
build_id = { type = "str", meaning = "Id of a build" }
blueprint_name = { type = "str", meaning = "Name of a Blueprint" }
turn_id = { type = "str", meaning = "Id of one agent turn", label = true }
request_id = { type = "str", meaning = "Id of one request", label = true }
header = { type = "str", meaning = "Name of a carrier header that was dropped" }
hop = { type = "str", meaning = "Name of a boundary a trace crosses, as dotted words" }
field = { type = "str", meaning = "Name of a runtime field that was dropped from an error record" }
dropped = { type = "int", meaning = "Count of entries dropped from a carrier" }
error_text = { type = "str", meaning = "A CONCORD_ERROR_TEXT value that was not recognised" }
instance_id = { type = "str", meaning = "Instance id", label = true }
label = { type = "str", meaning = "Short fixed label" }
error = { type = "str", meaning = "Display of an error, local debug logs only (rule 5)" }
source_record_id = { type = "str", meaning = "Id of the record an event describes" }
"error.type" = { type = "str", meaning = "OTel semconv error.type on a client span; set to the error code" }
"rpc.method" = { type = "str", meaning = "OTel semconv: RPC method" }
"http.request.method" = { type = "str", meaning = "OTel semconv: HTTP method" }
"code.file.path" = { type = "str", meaning = "OTel semconv: source file; added to every exported log record and span, never set by hand" }
"code.line.number" = { type = "str", meaning = "OTel semconv: source line; added to every exported log record and span, never set by hand" }
"code.module.name" = { type = "str", meaning = "OTel semconv: module path; added to every exported log record and span, never set by hand" }
"error.code" = { type = "str", meaning = "Stable code of an error" }
"error.class" = { type = "str", meaning = "Class of an error" }
"error.fingerprint" = { type = "str", meaning = "Fingerprint that groups equal errors" }
"error.source" = { type = "str", meaning = "Source of an error, as a short fixed word" }
ingress = { type = "str", meaning = "Name of the entry point a trace started at" }
service = { type = "str", meaning = "Name of the service a record is about" }
version = { type = "str", meaning = "Version of the service a record is about" }
uptime_ms = { type = "int", meaning = "Milliseconds the service has been up" }
target_session_id = { type = "str", meaning = "Id of the Session an operation is about; differs from the session_id label when acting on another" }
acp_session_id = { type = "str", meaning = "Session id held with an ACP agent; apart from the upstream session id" }
outcome = { type = "str", meaning = "Short label for how an operation ended" }
ok = { type = "bool", meaning = "The operation succeeded" }
count = { type = "int", meaning = "Number of items" }
reason = { type = "str", meaning = "Short fixed reason a decision was made or an operation refused" }
kind = { type = "str", meaning = "Fixed label for the kind of thing" }
command = { type = "str", meaning = "Program or command line an operation runs; never its environment", free_text = true }
listen = { type = "str", meaning = "Address a listener binds" }
attempt = { type = "int", meaning = "Attempt number of a retried operation" }
attempts = { type = "int", meaning = "Attempts made" }
cause = { type = "str", meaning = "What triggered an operation or re-derivation" }
status = { type = "str", meaning = "Status of the thing a record is about, as a short fixed word" }
node = { type = "str", meaning = "Id of a graph or transcript node" }
nodes = { type = "int", meaning = "Number of nodes" }
principal = { type = "str", meaning = "Principal id" }
file = { type = "str", meaning = "A file an operation touched" }
path = { type = "str", meaning = "Filesystem path an operation touched" }
target = { type = "str", meaning = "What an operation is aimed at" }
target_daemon_id = { type = "str", meaning = "Id of the daemon an operation is aimed at" }
skipped = { type = "bool", meaning = "The operation did nothing" }
skipped_count = { type = "int", meaning = "Number of items skipped" }
cwd = { type = "str", meaning = "Working directory" }
pid = { type = "int", meaning = "Process id" }
key_id = { type = "str", meaning = "Key thumbprint" }
message_count = { type = "int", meaning = "Number of messages" }
error_code = { type = "str", meaning = "Stable code of an error carried on an event" }
causes = { type = "str", meaning = "Causes captured at a request's entry point, as a JSON array of {kind, id}; a span attribute, never a label" }
source_instance_id = { type = "str", meaning = "Instance that issued a request (the caller's instance_id)", label = true }
source_turn_id = { type = "str", meaning = "Turn that issued a request (the caller's turn_id)", label = true }

[never]
names = ["content", "body", "stdout", "stderr", "prompt", "env", "password", "token", "secret"]

# Cause kinds: generic words, never service names. Each kind names the label that
# carries its id; caller_label carries a caller's id the receiver would overwrite.
[causes]
action = {label = "action_id"}
message = {label = "message_id"}
instance = {label = "instance_id", caller_label = "source_instance_id"}
turn = {label = "turn_id", caller_label = "source_turn_id"}
