# Shared field-name registry. Adding a name is a one-line PR.
# label = true: the field is a baggage label (carried across spans and processes, stamped
# as concord.label.<name>); it must not be recorded through Debug.
[fields]
action_id = { meaning = "grorg Action id", label = true }
session_id = { meaning = "grorg Session id", label = true }
elapsed_ms = { meaning = "Elapsed wall time in milliseconds" }
agent_id = { meaning = "Agent principal id (opaque string)", label = true }
delivery_id = { meaning = "multimatrix delivery id; stable across resends", label = true }
room_id = { meaning = "multimatrix room id" }
message_id = { meaning = "Room message id", label = true }
machine_id = { meaning = "Machine id", label = true }
offline_machine_id = { meaning = "Machine id that went offline" }
batch_sequence = { meaning = "Mailbox batch sequence number" }
context = { meaning = "Short fixed label for where a log comes from" }
node_id = { meaning = "archegraph DAG node id" }
build_id = { meaning = "archegraph build id" }
blueprint_name = { meaning = "archegraph Blueprint name" }
turn_id = { meaning = "Id of one agent turn", label = true }
request_id = { meaning = "Id of one request", label = true }
header = { meaning = "Name of a carrier header that was dropped" }
hop = { meaning = "Name of a boundary a trace crosses, as dotted words" }
dropped = { meaning = "Count of entries dropped from a carrier" }
error_text = { meaning = "A CONCORD_ERROR_TEXT value that was not recognised" }
instance_id = { meaning = "Instance id", label = true }
label = { meaning = "Short fixed label" }
error = { meaning = "Display of an error, local debug logs only (rule 5)" }
source_record_id = { meaning = "Id of the record an event describes" }
"error.type" = { meaning = "OTel semconv: error type" }
"rpc.method" = { meaning = "OTel semconv: RPC method" }
"http.request.method" = { meaning = "OTel semconv: HTTP method" }
"code.file.path" = { meaning = "OTel semconv: source file; added to every exported log record and span, never set by hand" }
"code.line.number" = { meaning = "OTel semconv: source line; added to every exported log record and span, never set by hand" }
"code.module.name" = { meaning = "OTel semconv: module path; added to every exported log record and span, never set by hand" }

[never]
names = ["content", "body", "stdout", "stderr", "prompt", "env", "password", "token", "secret"]
