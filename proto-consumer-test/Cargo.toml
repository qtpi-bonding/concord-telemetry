[package]
name = "proto-consumer-test"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Test-only consumer: a build.rs that compiles a proto importing principal.proto"

[dependencies]
concord-telemetry = { path = "../concord-telemetry" }
prost = "0.13"
pbjson = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
concord-telemetry-proto = { path = "../concord-telemetry-proto" }
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"
