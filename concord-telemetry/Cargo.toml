[package]
name = "concord-telemetry"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "One init, domain events and coded error records on OpenTelemetry"

[features]
default = ["reqwest-blocking-client"]
reqwest-blocking-client = ["opentelemetry-otlp/reqwest-blocking-client"]
tls = ["reqwest-blocking-client", "opentelemetry-otlp/reqwest-rustls"]
testing = ["opentelemetry_sdk/testing"]
grpc = ["dep:http", "dep:tower-layer", "dep:tower-service"]
channel = ["dep:tokio"]
http-server = ["dep:http", "dep:tower", "dep:tower-layer", "dep:tower-service", "dep:pin-project-lite"]

[dependencies]
concord-telemetry-proto = { path = "../concord-telemetry-proto", version = "0.1.0" }
concord-telemetry-derive = { path = "../concord-telemetry-derive", version = "0.1.0" }
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d", features = ["anyhow"] }
anyhow = "1"
concord-fields = { path = "../concord-fields", version = "0.1.0" }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["logs", "trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "logs", "trace"] }
opentelemetry-appender-tracing = { version = "=0.33.1" }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = { version = "1", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tower = { version = "0.5", optional = true }
tokio = { version = "1", optional = true, features = ["sync", "rt"] }
pin-project-lite = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
trybuild = "1"
pbjson-types = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
prost14 = { package = "prost", version = "0.14" }