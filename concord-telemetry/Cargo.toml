[package]
name = "concord-telemetry"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "One init, domain events and coded error records on OpenTelemetry"

[features]
default = ["otel"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing", "dep:tracing-opentelemetry", "opentelemetry-otlp/reqwest-blocking-client"]
tls = ["otel", "opentelemetry-otlp/reqwest-rustls"]
testing = ["otel", "opentelemetry_sdk/testing"]
grpc-status = ["grpc", "coded-error/grpc", "dep:tonic"]
grpc = ["dep:http", "dep:tower-layer", "dep:tower-service"]
channel = ["dep:tokio"]
lifecycle = ["dep:tokio"]
http-server = ["dep:http", "dep:tower", "dep:tower-layer", "dep:tower-service", "dep:pin-project-lite"]

[dependencies]
concord-telemetry-proto = { git = "https://github.com/qtpi-bonding/concord-telemetry-proto.git", rev = "4892badae333cfa7ebfdb4f17c76d65bb63612e4" }
concord-telemetry-derive = { path = "../concord-telemetry-derive", version = "0.2.0" }
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "de21d22e31baff78eae7d4ca817b87430bff1f81", features = ["anyhow"] }
anyhow = "1"
concord-fields = { path = "../concord-fields", version = "0.2.0" }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["logs", "trace"], optional = true }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["logs", "trace"], optional = true }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "logs", "trace"], optional = true }
opentelemetry-appender-tracing = { version = "=0.33.1", optional = true }
tracing-opentelemetry = { version = "=0.34.0", default-features = false, optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = { version = "1", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tower = { version = "0.5", optional = true }
tonic = { version = ">=0.13, <0.15", default-features = false, optional = true }
tokio = { version = "1", optional = true, features = ["sync", "rt", "time", "signal", "macros"] }
pin-project-lite = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
trybuild = "1"
pbjson-types = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = { version = "0.5", features = ["util"] }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
prost14 = { package = "prost", version = "0.14" }