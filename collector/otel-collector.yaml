# image: otel/opentelemetry-collector-contrib:<exact version, pinned by the orchestrator>
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  file:
    path: /var/otel/out.jsonl      # OTLP JSON, one object per line
    flush_interval: 1s
    rotation: { max_megabytes: 200, max_backups: 3 }
service:
  pipelines:
    logs:   { receivers: [otlp], exporters: [file] }
    traces: { receivers: [otlp], exporters: [file] }
